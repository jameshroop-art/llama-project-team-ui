[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-project-team-ui"
version = "0.1.0"
description = "Host-only llama-server launcher and conservative task-master planner"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "llama-project-team-ui contributors" }]
dependencies = [
  "PySide6>=6.8,<6.9",
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
llama-project-team-ui = "llama_project_team_ui.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["llama_project_team_ui*"]
